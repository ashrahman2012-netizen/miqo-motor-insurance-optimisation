services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miqo
      POSTGRES_USER: miqo
      POSTGRES_PASSWORD: miqo
    ports:
      - "5432:5432"
    volumes:
      - miqo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miqo -d miqo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  miqo_pgdata:
