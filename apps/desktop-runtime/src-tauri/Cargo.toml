[package]
name = "miqo-desktop-runtime"
version = "0.1.0"
description = "MIQO synthetic desktop runtime"
edition = "2021"
rust-version = "1.98.1"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
log = "=0.4.34"
reqwest = { version = "=0.13.5", features = ["blocking", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-log = "=2.9.2"
time = { version = "=0.3.55", features = ["formatting"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
