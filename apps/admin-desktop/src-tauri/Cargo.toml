[package]
name = "miqos-admin"
version = "0.1.0"
description = "MIQOS Windows Admin Application scaffold"
edition = "2021"
rust-version = "1.98.1"
publish = false

[lib]
name = "miqos_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
