name: desktop-build-g9

on:
  push:
    branches:
      - miqos/desktop-build-001
    paths:
      - ".github/workflows/desktop-build-g9.yml"
      - "scripts/desktop-ci.ps1"
      - "scripts/desktop-g8-proof.ps1"
      - "scripts/desktop-g9-proof.ps1"
      - "apps/admin-desktop/**"
      - "packages/application-contracts/**"
      - "packages/application-adapters/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/desktop-build-g9.yml"
      - "scripts/desktop-ci.ps1"
      - "scripts/desktop-g8-proof.ps1"
      - "scripts/desktop-g9-proof.ps1"
      - "apps/admin-desktop/**"
      - "packages/application-contracts/**"
      - "packages/application-adapters/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-g9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package-lifecycle:
    name: DB-G9 Windows package lifecycle
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Select exact Rust toolchain
        shell: pwsh
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Verify MSVC C++ toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere not found" }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) { throw "MSVC C++ build tools not found" }

      - name: Build exact-source Windows package
        shell: pwsh
        run: ./scripts/desktop-ci.ps1 -Mode Full

      - name: Execute DB-G9 lifecycle proof
        shell: pwsh
        run: ./scripts/desktop-g9-proof.ps1

      - name: Upload DB-G9 lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: miqos-desktop-db-g9-${{ github.sha }}
          path: |
            dist/g9-proof/**
            dist/g8-proof/g8-windows-proof.json
            dist/desktop/build-manifest.json
            dist/desktop/*.sha256
            dist/desktop/Cargo.lock
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
