name: desktop-g8-lock-refresh

on:
  push:
    branches:
      - miqos/desktop-prep-001
    paths:
      - ".github/workflows/desktop-g8-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: miqos/desktop-prep-001
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Select Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Generate controlled lockfiles
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo generate-lockfile --manifest-path apps/admin-desktop/src-tauri/Cargo.toml

      - name: Commit only lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/admin-desktop/src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Lockfiles already current."
            exit 0
          }
          git commit -m "DESKTOP G8: lock skeleton proof dependencies"
          git push origin HEAD:miqos/desktop-prep-001
