name: desktop-g8-rustfmt-fix

on:
  push:
    branches:
      - miqos/desktop-prep-001
    paths:
      - ".github/workflows/desktop-g8-rustfmt-fix.yml"

permissions:
  contents: write

jobs:
  rustfmt-only:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: miqos/desktop-prep-001
          persist-credentials: true

      - name: Select exact Rust toolchain
        shell: pwsh
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          rustfmt --version

      - name: Apply cargo fmt only
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/admin-desktop/src-tauri/Cargo.toml

          $changed = @(git diff --name-only)
          $expected = @(
            "apps/admin-desktop/src-tauri/build.rs",
            "apps/admin-desktop/src-tauri/src/lib.rs"
          )

          if ($changed.Count -ne $expected.Count) {
            Write-Host "Unexpected rustfmt diff:"
            $changed | ForEach-Object { Write-Host $_ }
            throw "rustfmt changed an unexpected number of files."
          }

          foreach ($file in $changed) {
            if ($expected -notcontains $file) {
              throw "rustfmt changed unexpected file '$file'."
            }
          }

          foreach ($file in $expected) {
            if ($changed -notcontains $file) {
              throw "Expected rustfmt change missing for '$file'."
            }
          }

          git diff --check
          git diff -- apps/admin-desktop/src-tauri/build.rs apps/admin-desktop/src-tauri/src/lib.rs

      - name: Commit formatting and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin-desktop/src-tauri/build.rs apps/admin-desktop/src-tauri/src/lib.rs
          git rm .github/workflows/desktop-g8-rustfmt-fix.yml
          git commit -m "DESKTOP G8: apply rustfmt to native proof sources"
          git push origin HEAD:miqos/desktop-prep-001
