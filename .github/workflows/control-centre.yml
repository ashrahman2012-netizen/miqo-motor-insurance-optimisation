name: control-centre

on:
  push:
    branches: [miqo/control-centre-v1, miqo/control-centre-cc3, miqo/control-centre-cc4, miqo/control-centre-cc5]
    paths:
      - "control-centre/**"
      - "scripts/verify-regression-matrix.mjs"
      - "package.json"
      - ".github/workflows/control-centre.yml"
  pull_request:
    paths:
      - "control-centre/**"
      - "scripts/verify-regression-matrix.mjs"
      - "package.json"
      - ".github/workflows/control-centre.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cc3-broker:
    runs-on: ubuntu-latest
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
      MIQOS_CC3_WRITES_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Verify CC3 + CC4 broker syntax
        run: |
          node --check control-centre/broker/config.mjs
          node --check control-centre/broker/store.mjs
          node --check control-centre/broker/github.mjs
          node --check control-centre/broker/github-write.mjs
          node --check control-centre/broker/model.mjs
          node --check control-centre/broker/mutation-policy.mjs
          node --check control-centre/broker/actions.mjs
          node --check control-centre/broker/event-normalizer.mjs
          node --check control-centre/broker/event-store.mjs
          node --check control-centre/broker/event-stream.mjs
          node --check control-centre/broker/events.mjs
          node --check control-centre/broker/server.mjs
          node --check control-centre/ui/cc4-state.mjs
          node --check control-centre/ui/cc4-client.mjs
          node --check control-centre/ui/notification-centre.mjs
          node --check control-centre/ui/system-map-state.mjs
      - name: Verify EH-2 regression matrix syntax
        run: node --check scripts/verify-regression-matrix.mjs
      - name: Verify CC5 closure verifier syntax
        run: node --check scripts/verify-control-plane-closure.mjs
      - name: Verify EH-2 unified regression matrix
        run: node scripts/verify-regression-matrix.mjs
      - name: Verify CC5 pre-closure consistency
        run: node scripts/verify-control-plane-closure.mjs
      - name: Run CC3 + CC4 broker contract tests
        run: npm run test:control-centre:broker
