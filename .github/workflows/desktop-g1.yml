name: desktop-g1

on:
  push:
    branches: [miqo/desktop-g1]
  pull_request:
    paths:
      - "apps/customer-web/**"
      - "apps/admin-web/**"
      - "apps/api/**"
      - "apps/desktop-runtime/**"
      - "packages/db/**"
      - "scripts/desktop-g1-*"
      - ".github/workflows/desktop-g1.yml"
      - "docs/gateways/DESKTOP-G1-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributable-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: miqo
          POSTGRES_USER: miqo
          POSTGRES_PASSWORD: miqo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miqo -d miqo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://miqo:miqo@127.0.0.1:5432/miqo
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
      PGPASSWORD: miqo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.3, cache: npm}
      - run: test "$(node --version)" = "v22.23.3"
      - run: test "$(npm --version)" = "10.9.9"
      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary
      - run: npx playwright install --with-deps chromium
      - name: Prove standalone web/API runtime with staged Node
        run: bash scripts/desktop-g1-runtime-proof.sh
      - name: Upload G1 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g1-runtime-${{ github.sha }}
          path: |
            dist/desktop-g1/runtime/runtime-manifest.json
            dist/desktop-g1-proof/**
          if-no-files-found: warn
          retention-days: 14

  embedded-pglite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22.23.3, cache: npm}
      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary
      - run: npx playwright install --with-deps chromium
      - name: Prove embedded PGlite runtime and restart persistence
        run: bash scripts/desktop-g1-pglite-proof.sh
      - name: Upload PGlite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g1-pglite-${{ github.sha }}
          path: dist/desktop-g1-pglite-proof/**
          if-no-files-found: warn
          retention-days: 14

  tauri-distributable:
    needs: embedded-pglite
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Verify Node and npm pins
        shell: pwsh
        run: |
          if ((node --version) -ne "v22.23.3") { throw "Node pin mismatch" }
          if ((npm --version) -ne "10.9.9") { throw "npm pin mismatch" }
      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary
      - name: Build standalone web runtimes without packaged static admin authority
        shell: pwsh
        run: |
          $env:NEXT_PUBLIC_API_URL="http://127.0.0.1:4000"
          $env:NEXT_PUBLIC_ADMIN_WEB_URL="http://127.0.0.1:3001"
          Remove-Item Env:NEXT_PUBLIC_MIQO_SYNTHETIC_ADMIN_GATE -ErrorAction SilentlyContinue
          Remove-Item Env:NEXT_PUBLIC_MIQO_SYNTHETIC_ADMIN_KEY -ErrorAction SilentlyContinue
          Remove-Item Env:MIQO_SYNTHETIC_ADMIN_GATE -ErrorAction SilentlyContinue
          Remove-Item Env:MIQO_SYNTHETIC_ADMIN_KEY -ErrorAction SilentlyContinue
          npm run build -w @miqo/customer-web
          npm run build -w @miqo/admin-web
      - run: node scripts/desktop-g1-stage-runtime.mjs
      - name: Stage exact Windows Node runtime
        shell: pwsh
        run: ./scripts/desktop-g2-stage-node.ps1
      - name: Stage repository-root runtime resources
        shell: pwsh
        run: |
          Remove-Item r -Recurse -Force -ErrorAction SilentlyContinue
          New-Item r -ItemType Directory -Force | Out-Null
          Copy-Item "dist\desktop-g1\runtime\*" r -Recurse -Force
          if (-not (Test-Path "r\runtime-manifest.json")) { throw "runtime-manifest.json missing from staged repository-root resources" }
      - name: Select exact Rust toolchain
        shell: pwsh
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
          cargo --version
      - name: Build resource-backed Windows Tauri runtime
        shell: pwsh
        run: cargo build --locked --manifest-path apps/desktop-runtime/src-tauri/Cargo.toml --bin miqo-desktop-runtime
      - name: Prove Windows Tauri packaged-runtime independence
        shell: pwsh
        run: |
          ./scripts/desktop-g3-local-capability-proof.ps1
          New-Item "dist\desktop-g1-tauri-proof" -ItemType Directory -Force | Out-Null
          @{
            g1_5="PASS"
            g1_6="PASS"
            nativeRuntime="WINDOWS"
            packagedRuntime="PASS"
            certifiedCapabilityProof="G3.5"
            hostNodeRequired=$false
            hostNpmRequired=$false
            dockerRequired=$false
            externalPostgresRequired=$false
            boundary="SYNTHETIC_ONLY"
          } | ConvertTo-Json | Set-Content "dist\desktop-g1-tauri-proof\g1-tauri-proof.json"
      - name: Upload G1 Tauri evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g1-tauri-${{ github.sha }}
          path: |
            dist/desktop-g1-tauri-proof/**
            dist/desktop-g3-g3.5-proof/**
          if-no-files-found: warn
          retention-days: 14
