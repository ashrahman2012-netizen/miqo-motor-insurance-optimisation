name: desktop-g3

on:
  push:
    branches: [miqo/desktop-g3, miqo/desktop-uat-remediation]
  pull_request:
    paths:
      - "apps/desktop-runtime/**"
      - "apps/api/**"
      - "packages/db/**"
      - "scripts/desktop-g3-*"
      - ".github/workflows/desktop-g3.yml"
      - "docs/gateways/DESKTOP-G3-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pglite-encryption-feasibility:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Verify exact Node runtime
        shell: pwsh
        run: |
          if ((node --version) -ne "v22.23.3") { throw "Unexpected Node version: $(node --version)" }
      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary
      - name: Execute G3.2 encrypted PGlite feasibility proof
        run: node --experimental-strip-types scripts/desktop-g3-pglite-encryption-feasibility.ts
      - name: Upload G3.2 feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.2-feasibility-${{ github.sha }}
          path: dist/desktop-g3-g3.2-proof/**
          if-no-files-found: warn
          retention-days: 14

  protected-runtime-integration:
    needs: pglite-encryption-feasibility
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Verify exact Node runtime
        shell: pwsh
        run: |
          if ((node --version) -ne "v22.23.3") { throw "Unexpected Node version: $(node --version)" }
      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary
      - name: Execute G3.3 protected runtime integration proof
        run: node scripts/desktop-g3-protected-runtime-proof.mjs
      - name: Upload G3.3 protected runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.3-protected-runtime-${{ github.sha }}
          path: dist/desktop-g3-g3.3-proof/**
          if-no-files-found: warn
          retention-days: 14

  windows-key-lifecycle-primary:
    needs: protected-runtime-integration
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Verify exact Node runtime
        shell: pwsh
        run: |
          if ((node --version) -ne "v22.23.3") { throw "Unexpected Node version: $(node --version)" }

      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary

      - name: Select exact Rust toolchain
        shell: pwsh
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Build locked G3.4 desktop/key lifecycle targets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path r -Force | Out-Null
          cargo check --locked --manifest-path apps/desktop-runtime/src-tauri/Cargo.toml --bin miqo-desktop-runtime
          cargo build --locked --manifest-path apps/desktop-runtime/src-tauri/Cargo.toml --example g3-keyring-proof

      - name: Execute DPAPI lifecycle, reinstall, rotation and corruption proof
        shell: pwsh
        run: |
          $exe=Resolve-Path "apps/desktop-runtime/src-tauri/target/debug/examples/g3-keyring-proof.exe"
          $data=Join-Path $env:RUNNER_TEMP "miqo-g3-key-data"
          $evidence=Join-Path $env:GITHUB_WORKSPACE "dist/desktop-g3-g3.4-proof"
          & $exe lifecycle $data $env:GITHUB_WORKSPACE $evidence
          if ($LASTEXITCODE -ne 0) { throw "G3.4 primary key lifecycle proof failed with exit code $LASTEXITCODE" }

      - name: Prove different-user failure and machine-share same-machine behavior
        shell: pwsh
        run: |
          $user="miqo_g3_alt"
          $plainPassword="G3-Synthetic-Only!9247"
          $secure=ConvertTo-SecureString $plainPassword -AsPlainText -Force
          $publicRoot=Join-Path $env:PUBLIC "miqo-g3-proof"
          New-Item -ItemType Directory -Path $publicRoot -Force | Out-Null
          $sourceExe=Resolve-Path "apps/desktop-runtime/src-tauri/target/debug/examples/g3-keyring-proof.exe"
          $publicExe=Join-Path $publicRoot "g3-keyring-proof.exe"
          $sourceKeyring=Resolve-Path "dist/desktop-g3-g3.4-proof/wrapped-keyring-for-context-probes.json"
          $publicKeyring=Join-Path $publicRoot "wrapped-keyring.json"
          Copy-Item $sourceExe $publicExe -Force
          Copy-Item $sourceKeyring $publicKeyring -Force
          icacls $publicRoot /grant "*S-1-5-32-545:(OI)(CI)RX" /T | Out-Null

          try {
            if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $user }
            New-LocalUser -Name $user -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
            $cred=New-Object System.Management.Automation.PSCredential(".\$user",$secure)

            $userProbe=Start-Process -FilePath $publicExe -ArgumentList @("probe-user",$publicKeyring) -Credential $cred -LoadUserProfile -Wait -PassThru -WindowStyle Hidden
            if ($userProbe.ExitCode -eq 0) {
              throw "Different Windows user unexpectedly unwrapped the current-user DPAPI share"
            }

            $machineProbe=Start-Process -FilePath $publicExe -ArgumentList @("probe-machine",$publicKeyring) -Credential $cred -LoadUserProfile -Wait -PassThru -WindowStyle Hidden
            if ($machineProbe.ExitCode -ne 0) {
              throw "Machine DPAPI share did not unwrap for a different user on the same machine"
            }

            @{
              gate="G3.4"
              differentUserUserShare="PASS_FAIL_CLOSED"
              differentUserMachineShareSameMachine="PASS_UNWRAP"
              boundary="SYNTHETIC_ONLY"
            } | ConvertTo-Json | Set-Content "dist/desktop-g3-g3.4-proof/g3.4-wrong-user-proof.json"
          }
          finally {
            if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $user }
            Remove-Item $publicRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload G3.4 primary and wrapped-context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.4-primary-${{ github.sha }}
          path: dist/desktop-g3-g3.4-proof/**
          if-no-files-found: warn
          retention-days: 14

  windows-key-lifecycle-wrong-machine:
    needs: windows-key-lifecycle-primary
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select exact Rust toolchain
        shell: pwsh
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Build locked G3.4 key lifecycle proof
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path r -Force | Out-Null
          cargo build --locked --manifest-path apps/desktop-runtime/src-tauri/Cargo.toml --example g3-keyring-proof

      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-g3.4-primary-${{ github.sha }}
          path: dist/desktop-g3-g3.4-source

      - name: Prove machine-bound share fails on a different Windows runner
        shell: pwsh
        run: |
          $exe=Resolve-Path "apps/desktop-runtime/src-tauri/target/debug/examples/g3-keyring-proof.exe"
          $keyring=(Get-ChildItem "dist/desktop-g3-g3.4-source" -Recurse -Filter "wrapped-keyring-for-context-probes.json" | Select-Object -First 1).FullName
          if (-not $keyring) { throw "Wrapped keyring evidence not found" }

          $PSNativeCommandUseErrorActionPreference = $false
          $probeOutput = (& $exe probe-machine $keyring 2>&1 | Out-String)
          $probeExit = $LASTEXITCODE
          if ($probeExit -eq 0) {
            throw "Machine-bound keyring unexpectedly opened on a different Windows runner"
          }
          if ($probeOutput -notmatch "G3_MACHINE_CONTEXT_MISMATCH") {
            throw "Wrong-machine probe failed for an unexpected reason: $probeOutput"
          }

          New-Item -ItemType Directory -Path "dist/desktop-g3-g3.4-wrong-machine" -Force | Out-Null
          @{
            gate="G3.4"
            machineContext="DIFFERENT_WINDOWS_RUNNER"
            machineBindingMethod="MACHINEGUID_PLUS_SMBIOS_UUID_V1"
            machineContextCheck="PASS_FAIL_CLOSED"
            expectedFailureCode="G3_MACHINE_CONTEXT_MISMATCH"
            boundary="SYNTHETIC_ONLY"
          } | ConvertTo-Json | Set-Content "dist/desktop-g3-g3.4-wrong-machine/g3.4-wrong-machine-proof.json"

          # The native probe must fail on the wrong machine. After validating the
          # exact fail-closed code above, explicitly return success for this
          # negative-test harness rather than leaking the expected native exit.
          exit 0

      - name: Upload G3.4 wrong-machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.4-wrong-machine-${{ github.sha }}
          path: dist/desktop-g3-g3.4-wrong-machine/**
          if-no-files-found: warn
          retention-days: 14

  key-lifecycle-certification:
    needs:
      - windows-key-lifecycle-primary
      - windows-key-lifecycle-wrong-machine
    runs-on: ubuntu-latest
    steps:
      - name: Record bounded G3.4 execution result
        run: |
          echo "G3.4 DPAPI user+machine lifecycle evidence complete."
          echo "Boundary remains SYNTHETIC_ONLY."

  local-capability-hardening:
    needs: key-lifecycle-certification
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Verify exact Node runtime
        shell: pwsh
        run: |
          if ((node --version) -ne "v22.23.3") { throw "Unexpected Node version: $(node --version)" }
      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary
      - name: Build standalone web runtimes without packaged static admin authority
        shell: pwsh
        run: |
          $env:NEXT_PUBLIC_API_URL="http://127.0.0.1:4000"
          $env:NEXT_PUBLIC_ADMIN_WEB_URL="http://127.0.0.1:3001"
          Remove-Item Env:NEXT_PUBLIC_MIQO_SYNTHETIC_ADMIN_GATE -ErrorAction SilentlyContinue
          Remove-Item Env:NEXT_PUBLIC_MIQO_SYNTHETIC_ADMIN_KEY -ErrorAction SilentlyContinue
          Remove-Item Env:MIQO_SYNTHETIC_ADMIN_GATE -ErrorAction SilentlyContinue
          npm run build -w @miqo/customer-web
          npm run build -w @miqo/admin-web
      - run: node scripts/desktop-g1-stage-runtime.mjs
      - name: Stage exact Windows Node runtime
        shell: pwsh
        run: ./scripts/desktop-g2-stage-node.ps1
      - name: Select exact Rust toolchain
        shell: pwsh
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Build locked native runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path r -Force | Out-Null
          cargo build --locked --manifest-path apps/desktop-runtime/src-tauri/Cargo.toml --bin miqo-desktop-runtime
      - name: Execute G3.5 owned-runtime capability proof
        shell: pwsh
        run: ./scripts/desktop-g3-local-capability-proof.ps1
      - name: Upload G3.5 capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.5-local-capability-${{ github.sha }}
          path: dist/desktop-g3-g3.5-proof/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload owned runtime build for downstream G3 security gates
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-runtime-build-${{ github.sha }}
          path: |
            dist/desktop-g1/runtime/**
            apps/desktop-runtime/src-tauri/target/debug/miqo-desktop-runtime.exe
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  webview-local-origin-hardening:
    needs: local-capability-hardening
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-runtime-build-${{ github.sha }}
          path: .
      - name: Execute G3.6 WebView/local-origin hardening proof
        shell: pwsh
        run: ./scripts/desktop-g3-webview-hardening-proof.ps1
      - name: Upload G3.6 hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.6-webview-hardening-${{ github.sha }}
          path: dist/desktop-g3-g3.6-proof/**
          if-no-files-found: warn
          retention-days: 14

  diagnostics-redaction:
    needs: webview-local-origin-hardening
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-runtime-build-${{ github.sha }}
          path: .
      - name: Execute G3.7 diagnostics/redaction proof
        shell: pwsh
        run: ./scripts/desktop-g3-diagnostics-redaction-proof.ps1
      - name: Upload G3.7 redaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.7-diagnostics-redaction-${{ github.sha }}
          path: dist/desktop-g3-g3.7-proof/**
          if-no-files-found: warn
          retention-days: 14

  windows-negative-security:
    needs: diagnostics-redaction
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-g3.3-protected-runtime-${{ github.sha }}
          path: dist/desktop-g3-g3.8-input/g3.3

      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-g3.4-primary-${{ github.sha }}
          path: dist/desktop-g3-g3.8-input/g3.4-primary

      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-g3.4-wrong-machine-${{ github.sha }}
          path: dist/desktop-g3-g3.8-input/g3.4-wrong-machine

      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-g3.5-local-capability-${{ github.sha }}
          path: dist/desktop-g3-g3.8-input/g3.5

      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-g3.6-webview-hardening-${{ github.sha }}
          path: dist/desktop-g3-g3.8-input/g3.6

      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-g3.7-diagnostics-redaction-${{ github.sha }}
          path: dist/desktop-g3-g3.8-input/g3.7

      - uses: actions/download-artifact@v4
        with:
          name: desktop-g3-runtime-build-${{ github.sha }}
          path: .

      - name: Execute G3.8 Windows negative-security certification
        shell: pwsh
        run: ./scripts/desktop-g3-negative-security-proof.ps1

      - name: Upload G3.8 negative-security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.8-negative-security-${{ github.sha }}
          path: dist/desktop-g3-g3.8-proof/**
          if-no-files-found: warn
          retention-days: 14

  windows-installer-regression:
    needs: windows-negative-security
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Verify Node and npm pins
        shell: pwsh
        run: |
          if ((node --version) -ne "v22.23.3") { throw "Node pin mismatch" }
          if ((npm --version) -ne "10.9.9") { throw "npm pin mismatch" }

      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary

      - name: Build standalone web runtimes without static packaged authority
        shell: pwsh
        run: |
          $env:NEXT_PUBLIC_API_URL="http://127.0.0.1:4000"
          $env:NEXT_PUBLIC_ADMIN_WEB_URL="http://127.0.0.1:3001"
          Remove-Item Env:NEXT_PUBLIC_MIQO_SYNTHETIC_ADMIN_GATE -ErrorAction SilentlyContinue
          Remove-Item Env:NEXT_PUBLIC_MIQO_SYNTHETIC_ADMIN_KEY -ErrorAction SilentlyContinue
          Remove-Item Env:MIQO_SYNTHETIC_ADMIN_GATE -ErrorAction SilentlyContinue
          Remove-Item Env:MIQO_SYNTHETIC_ADMIN_KEY -ErrorAction SilentlyContinue
          npm run build -w @miqo/customer-web
          npm run build -w @miqo/admin-web

      - run: node scripts/desktop-g1-stage-runtime.mjs

      - name: Stage exact Windows Node runtime
        shell: pwsh
        run: ./scripts/desktop-g2-stage-node.ps1

      - name: Stage runtime resources for NSIS
        shell: pwsh
        run: |
          Remove-Item r -Recurse -Force -ErrorAction SilentlyContinue
          robocopy dist\desktop-g1\runtime r /E /NFL /NDL /NJH /NJS /NP
          $code=$LASTEXITCODE
          if ($code -gt 7) { throw "robocopy failed with exit code $code" }
          $global:LASTEXITCODE=0

      - name: Select exact Rust toolchain
        shell: pwsh
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Install verified pinned Tauri CLI
        shell: pwsh
        run: |
          $url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $archive=Join-Path $env:RUNNER_TEMP "cargo-tauri.zip"
          $extract=Join-Path $env:RUNNER_TEMP "cargo-tauri"
          Invoke-WebRequest $url -OutFile $archive
          $actual=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected="0743e30a661a35d63339b24cf63828f97ba5389a1d7f13b368a542794dd0a3f3"
          if ($actual -ne $expected) { throw "Tauri CLI checksum mismatch: $actual" }
          Expand-Archive $archive -DestinationPath $extract -Force
          Copy-Item (Join-Path $extract "cargo-tauri.exe") (Join-Path $env:USERPROFILE ".cargo\bin\cargo-tauri.exe") -Force
          cargo tauri --version

      - name: Build current-head unsigned Windows x64 NSIS installer
        shell: pwsh
        run: |
          subst M: "$env:GITHUB_WORKSPACE"
          try {
            Push-Location M:\apps\desktop-runtime\src-tauri
            cargo tauri build --config tauri.windows-g2.conf.json --bundles nsis
            Pop-Location
          }
          finally {
            if ((Get-Location).Path -like "M:*") { Pop-Location }
            subst M: /D
          }

      - name: Execute G3.9 current-head installer/runtime regression
        shell: pwsh
        run: ./scripts/desktop-g3-installer-regression-proof.ps1

      - name: Upload G3.9 installer/runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-g3-g3.9-installer-regression-${{ github.sha }}
          path: |
            apps/desktop-runtime/src-tauri/target/release/bundle/nsis/*-setup.exe
            dist/desktop-g3-g3.9-proof/**
          if-no-files-found: warn
          retention-days: 14
