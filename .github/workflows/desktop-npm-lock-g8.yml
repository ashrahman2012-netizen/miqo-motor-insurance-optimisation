name: desktop-npm-lock-g8

on:
  push:
    branches:
      - miqos/desktop-prep-001
    paths:
      - ".github/workflows/desktop-npm-lock-g8.yml"
      - "apps/admin-desktop/package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm-lock:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: miqos/desktop-prep-001
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Generate npm lockfile
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated npm lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "package-lock.json already current."
            exit 0
          }
          git commit -m "DESKTOP G8.1: refresh npm lock"
          git push origin HEAD:miqos/desktop-prep-001
