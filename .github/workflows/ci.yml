name: ci

on: [push, pull_request]

jobs:
  locked-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: test "$(node --version)" = "v22.16.0"
      - run: test "$(npm --version)" = "10.9.2"
      - run: test -f package-lock.json
      - run: npm ci
      - run: npm run verify:pins
      - run: npm run verify:boundary
        env: {MIQO_DATA_CLASSIFICATION: SYNTHETIC, MIQO_LIVE_PROVIDERS_ENABLED: "false"}
      - run: npm run test:invariants
      - run: npm run test:sprint1
      - run: npm run test:sprint1:persisted
      - run: npm run test -w @miqo/mock-providers
      - run: npm run test -w @miqo/normalisation
      - run: npm run test -w @miqo/comparison
      - run: npm run test -w @miqo/integrity
      - run: npm run test -w @miqo/optimisation
      - run: npm run test -w @miqo/scenarios
      - run: npm run test -w @miqo/quote-orchestration
      - run: npm run typecheck -w @miqo/application-adapters
      - run: npm run test -w @miqo/application-adapters
      - run: npm run typecheck -w @miqo/ui
      - run: npm run test -w @miqo/ui
      - run: npm run certify:app-build-001
      - run: npm run smoke:domain
      - run: npm run build

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: miqo, POSTGRES_USER: miqo, POSTGRES_PASSWORD: miqo}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miqo -d miqo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env: {PGPASSWORD: miqo}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0001_walking_skeleton.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0002_optimisation_preferences.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0003_scenario_generation.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0004_prequote_integrity.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0005_mock_provider_raw_capture.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0006_quote_normalisation.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0007_selection_final_integrity.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0008_optimisation_policy_persistence.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0009_sp4_multiscenario_generation.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0010_sp4_market_route_quotation.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0011_sp4_occupation_vehicle_integrity.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0012_sp4_recommendation.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f packages/db/migrations/0013_sp4_explainability_commercial_independence.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint1-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint2-foundation-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint2-scenario-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint2-prequote-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint2-raw-provider-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint2-normalisation-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint3-selection-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint4-policy-persistence-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint4-multiscenario-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint4-market-route-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint4-occupation-vehicle-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint4-recommendation-contract.sql
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint4-explainability-commercial-independence-contract.sql

  target-stack-sprint1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: miqo, POSTGRES_USER: miqo, POSTGRES_PASSWORD: miqo}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miqo -d miqo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://miqo:miqo@127.0.0.1:5432/miqo
      PGPASSWORD: miqo
      MIQO_DATA_CLASSIFICATION: SYNTHETIC
      MIQO_LIVE_PROVIDERS_ENABLED: "false"
      MIQO_ADMIN_AUTH_ISSUER: http://127.0.0.1:4100
      MIQO_ADMIN_AUTH_AUDIENCE: miqos-api-test
      MIQO_ADMIN_AUTH_JWKS_URL: http://127.0.0.1:4100/jwks
      MIQO_ADMIN_GROUP_PERMISSION_MAP: '{"miqos-admin-read":["miqos.admin.case.read","miqos.admin.profile.read","miqos.admin.audit.read","miqos.admin.trace.read","miqos.admin.discrepancy.read","miqos.admin.integrity.read","miqos.admin.system.read"],"miqos-admin-raw":["miqos.admin.raw-evidence.read"],"miqos-admin-profile":["miqos.admin.profile.read"]}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22.16.0, cache: npm}
      - run: test -f package-lock.json && npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run verify:boundary
      - run: npm run db:migrate
      - run: npm run db:seed:syn001
      - name: Start deterministic TEST OIDC authority
        run: |
          node scripts/desktop-test-idp.mjs > /tmp/miqo-test-idp.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4100/.well-known/openid-configuration > /dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/miqo-test-idp.log
          exit 1
      - run: psql -h 127.0.0.1 -U miqo -d miqo -f scripts/postgres-sprint1-contract.sql
      - name: Run PostgreSQL API regression
        shell: bash
        run: |
          set -euo pipefail
          for test_file in apps/api/test/*.test.ts; do
            echo "::group::${test_file}"
            timeout 90s node --experimental-strip-types --test --test-concurrency=1 "${test_file}"
            echo "::endgroup::"
          done
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.target.config.ts
      - run: npm run certify:app-build-001
      - run: npm run build
