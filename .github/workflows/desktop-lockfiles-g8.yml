name: desktop-lockfiles-g8

on:
  push:
    branches:
      - miqos/desktop-prep-001
    paths:
      - ".github/workflows/desktop-lockfiles-g8.yml"
      - "apps/admin-desktop/**"
  pull_request:
    paths:
      - ".github/workflows/desktop-lockfiles-g8.yml"
      - "apps/admin-desktop/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Select Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Generate npm lockfile
        shell: pwsh
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate Cargo lockfile
        shell: pwsh
        run: cargo generate-lockfile --manifest-path apps/admin-desktop/src-tauri/Cargo.toml

      - name: Stage lockfiles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lockfiles/apps/admin-desktop/src-tauri | Out-Null
          Copy-Item package-lock.json lockfiles/package-lock.json
          Copy-Item apps/admin-desktop/src-tauri/Cargo.lock lockfiles/apps/admin-desktop/src-tauri/Cargo.lock

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-g8-lockfiles
          path: lockfiles/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
