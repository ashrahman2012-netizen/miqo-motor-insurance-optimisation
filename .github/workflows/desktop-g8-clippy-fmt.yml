name: desktop-g8-clippy-fmt

on:
  push:
    branches:
      - miqos/desktop-prep-001
    paths:
      - ".github/workflows/desktop-g8-clippy-fmt.yml"

permissions:
  contents: write

jobs:
  fmt-after-clippy:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: miqos/desktop-prep-001
          persist-credentials: true

      - name: Select exact Rust toolchain
        shell: pwsh
        run: |
          rustup set auto-self-update disable
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          rustfmt --version

      - name: Run cargo fmt with narrow diff guard
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/admin-desktop/src-tauri/Cargo.toml

          $changed = @(git diff --name-only)
          foreach ($file in $changed) {
            if ($file -ne "apps/admin-desktop/src-tauri/src/lib.rs") {
              Write-Host "Unexpected formatter change: $file"
              throw "cargo fmt changed a file outside the authorised native source."
            }
          }

          git diff --check
          git diff -- apps/admin-desktop/src-tauri/src/lib.rs

      - name: Commit formatter result and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (Test-Path "apps/admin-desktop/src-tauri/src/lib.rs") {
            git add apps/admin-desktop/src-tauri/src/lib.rs
          }
          git rm .github/workflows/desktop-g8-clippy-fmt.yml
          git commit -m "DESKTOP G8: format Clippy convergence source"
          git push origin HEAD:miqos/desktop-prep-001
